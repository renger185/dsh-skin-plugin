<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Skin">
  <defs>
    <clipPath id="frame">
      <rect x="8" y="12" width="48" height="40" rx="6" />
    </clipPath>
  </defs>
  <!-- 画面左半亮、右半暗:这张图就是「按图的明暗自动翻文字」的示意 -->
  <g clip-path="url(#frame)">
    <rect x="8" y="12" width="24" height="40" fill="#f2ede4" />
    <rect x="32" y="12" width="24" height="40" fill="#2b2f3a" />
    <circle cx="20" cy="24" r="4" fill="#e8b24a" />
    <path d="M8 44 L22 30 L34 44 Z" fill="#7d9a6a" />
    <path d="M32 44 L44 32 L56 44 Z" fill="#4a5f7a" />
  </g>
  <rect x="8" y="12" width="48" height="40" rx="6" fill="none" stroke="#8b93a3" stroke-width="3" />
  <!-- 中缝:亮暗切换的那一刀 -->
  <path d="M32 12 V52" stroke="#c8cedb" stroke-width="2" />
</svg>
